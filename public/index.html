<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algo and Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("b75.theme");document.documentElement.dataset.theme=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}catch(e){}</script>
<style>
:root {
  /* Layout: action first. Today = what to review now, rated in one click; Coding and System design hold the full lists; any item opens a side drawer. */
  --bg: #f5f4fa;
  --dot: #e2dfee;
  --surface: #ffffff;
  --surface-2: #f8f7fc;
  --ink: #1e1a33;
  --ink-2: #555070;
  --muted: #858099;
  --line: #e1deec;
  --code: #6246ea; --code-soft: #eeeaff; --code-ink: #4b31c9;
  --sd: #1c8ce0; --sd-soft: #e2f1fd; --sd-ink: #0f68ab;
  --red: #f05454; --red-soft: #fdeaea; --red-ink: #b02525;
  --yellow: #f5b623; --yellow-soft: #fff4d6; --yellow-ink: #855900;
  --green: #22b07d; --green-soft: #e0f5ec; --green-ink: #0f7049;
  --heat-0: #ecebf3; --heat-1: #d3cbff; --heat-2: #a995ff; --heat-3: #7d61f5; --heat-4: #4b31c9;
  --tactile: 0 2px 0 var(--shadow);
  --lift: 0 1px 2px rgba(30,26,51,.05), 0 8px 24px -14px rgba(30,26,51,.22);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --edge: var(--ink); --shadow: var(--ink); --inverse-bg: var(--ink); --inverse-fg: #ffffff; --chip-b: #c9c2ff;
  --glass: rgba(255,255,255,.94); --road: #e4e0f2; --road-dash: #ffffff; --line-strong: #c9c5d8;
  --mastered: #0f7049; --on-mastered: #ffffff; --on-bright: #1e1a33;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #12101f; --dot: #221f36; --surface: #1b1830; --surface-2: #231f3b;
  --ink: #edebf7; --ink-2: #b6b1cf; --muted: #8d88a8; --line: #322d4d; --line-strong: #4a4468;
  --code: #7c66ff; --code-soft: #2a2452; --code-ink: #b9abff;
  --sd: #3aa2f0; --sd-soft: #142f47; --sd-ink: #8ccbff;
  --red: #f26666; --red-soft: #3f1f28; --red-ink: #ffa3a3;
  --yellow: #f5b623; --yellow-soft: #3a2e12; --yellow-ink: #f5cd6b;
  --green: #2bbf8a; --green-soft: #143528; --green-ink: #6fdcb1;
  --heat-0: #26223d; --heat-1: #3b3170; --heat-2: #5a47b8; --heat-3: #7d61f5; --heat-4: #b9abff;
  --edge: #6c6690; --shadow: #07060d; --inverse-bg: #edebf7; --inverse-fg: #17142a; --chip-b: #4b31c9;
  --glass: rgba(18,16,31,.9); --road: #34304f; --road-dash: rgba(255,255,255,.55);
  --mastered: #6fdcb1; --on-mastered: #0c2a1d;
  --lift: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
/* text on bright fills stays dark in both themes */
:root[data-theme="dark"] .st.st-done, :root[data-theme="dark"] .st.st-behind, :root[data-theme="dark"] .node.st-scheduled .disc, :root[data-theme="dark"] .node.st-mastered .disc { color: var(--on-bright); }
:root[data-theme="dark"] .st.st-done svg path, :root[data-theme="dark"] .wkdone-badge svg path { stroke: var(--on-bright); }
.iconbtn { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn:hover { color: var(--ink); border-color: var(--ink-2); }
.foot { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 16px; padding: 18px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.foot a { color: var(--ink-2); font-weight: 600; }
.foot a:hover { color: var(--code-ink); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 500 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--code-ink); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
:focus-visible { outline: 2.5px solid var(--code); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 30; background: var(--glass); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1160px; margin: 0 auto; padding: 0 20px; height: 62px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); flex: none; background: none; border: 0; padding: 4px 8px 4px 4px; margin-left: -4px; border-radius: 12px; cursor: pointer; text-align: left; }
.brand:hover, .brand[aria-expanded="true"] { background: var(--surface-2); }
.brand .chev { vertical-align: -1px; color: var(--ink-2); }
.brand-text small b, .brand-text small span { font: inherit; color: var(--ink); font-weight: 600; }
.mark { min-width: 34px; padding: 0 6px; height: 34px; border-radius: 9px; background: var(--inverse-bg); color: var(--inverse-fg); display: grid; place-items: center; font: 800 13px/1 var(--font-display); letter-spacing: -0.02em; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text b { font: 700 16.5px var(--font-display); }
.brand-text small { font-size: 12px; color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 2px; }
.nav a { text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14.5px; padding: 7px 11px; border-radius: 9px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--code-soft); }
.nav .n { font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.nav .due { font: 700 11.5px/1 var(--font-body); background: var(--red); color: #fff; border-radius: 99px; padding: 3px 6px; }
.search { position: relative; flex: 1; min-width: 150px; max-width: 340px; margin-left: auto; }
.search input[type="search"] { width: 100%; height: 38px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 0 34px 0 36px; font-weight: 500; }
.search input:focus { background: var(--surface); border-color: var(--code); outline: none; box-shadow: 0 0 0 3px var(--code-soft); }
.search > svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 600 11.5px var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--surface); pointer-events: none; }
.gs-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: 300px; list-style: none; margin: 0; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--lift); z-index: 50; max-height: 60vh; overflow-y: auto; }
.gs-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.gs-list li[aria-selected="true"], .gs-list li:hover { background: var(--code-soft); }
.gs-list .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gs-list .empty-li { color: var(--muted); cursor: default; background: none !important; }
.sync { flex: none; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.sync[data-s="saving"]::before { background: var(--yellow); }
.sync[data-s="error"]::before, .sync[data-s="local"]::before { background: var(--red); }
.sync[data-s="loading"]::before { background: var(--line); }
.tabbar { display: none; }

main { max-width: 1160px; margin: 0 auto; padding: 28px 20px 80px; display: flex; flex-direction: column; gap: 22px; }
#view { display: flex; flex-direction: column; gap: 30px; }
#banners { display: flex; flex-direction: column; gap: 10px; }
#banners:empty { display: none; }
.banner { border: 1px solid color-mix(in srgb, var(--yellow) 50%, transparent); border-radius: 12px; padding: 10px 14px; background: var(--yellow-soft); color: var(--yellow-ink); font-weight: 600; }
.banner.info { background: var(--surface); color: var(--ink-2); border-color: var(--line); box-shadow: var(--lift); }
.banner.has-act { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.banner.has-act > span { flex: 1 1 320px; }
.banner .b-act { display: flex; gap: 8px; flex-wrap: wrap; }
.signin-btn { flex: none; }
.signin-btn[hidden] { display: none; }
/* floating note for people using the app without an account */
.gb { position: fixed; right: 18px; bottom: 18px; z-index: 33; display: flex; flex-direction: column; align-items: flex-end; }
.gb[hidden] { display: none; }
.gb-pill { display: inline-flex; align-items: center; gap: 8px; font: 600 13px/1 var(--font-body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 9px 14px 9px 11px; box-shadow: var(--lift); cursor: pointer; }
.gb-pill:hover { border-color: var(--ink-2); color: var(--ink); }
.gb-pill svg, .gb-top svg { width: 18px; height: 18px; color: var(--code); flex: none; }
.gb-card { width: min(340px, calc(100vw - 24px)); background: var(--surface); border: 1.5px solid var(--edge); border-radius: 14px; box-shadow: 0 4px 0 var(--shadow); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; transform-origin: bottom right; animation: gb-in .16s ease-out; }
.gb-top { display: flex; align-items: center; gap: 8px; width: 100%; }
.gb-top b { flex: 1; font: 700 15.5px/1.2 var(--font-display); color: var(--ink); }
.gb-card p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.gb-x { flex: none; width: 30px; height: 30px; margin: -4px -6px -4px 0; border: 0; background: none; border-radius: 8px; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.gb-x:hover { background: var(--surface-2); color: var(--ink); }
@keyframes gb-in { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .gb-card { animation: none; } }
@media (max-width: 760px) {
  .gb { right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); }
  .gb-pill { padding: 10px; }
  .gb-pill span { display: none; }
}
@media (max-width: 480px) { .sync span { display: none; } }
.signin-btn svg { width: 16px; height: 16px; }
.banner.err { background: var(--red-soft); color: var(--red-ink); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

/* ---------- buttons, tags ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px solid var(--edge); background: var(--surface); color: var(--ink); box-shadow: var(--tactile);
  padding: 6px 13px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--shadow); }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--shadow); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: var(--tactile); }
.btn-primary { background: var(--code); color: #fff; }
.btn-sd { background: var(--sd); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 13px; border-radius: 9px; }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); box-shadow: none; transform: none; color: var(--ink); }
.btn-ghost:active { transform: none; }
.btn-danger { color: var(--red-ink); }
.linkish { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; font-weight: 700; }
.linkish:hover { color: var(--code-ink); text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--lift); }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.tag.code { background: var(--code-soft); color: var(--code-ink); border-color: transparent; }
.tag.sd { background: var(--sd-soft); color: var(--sd-ink); border-color: transparent; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--ink-2); font-size: 13px; }
.diff-Hard { color: var(--ink); font-weight: 700; }

.beads { display: inline-flex; align-items: center; gap: 3px; }
.bead { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--edge); flex: none; }
.bead.Red { background: var(--red); } .bead.Yellow { background: var(--yellow); } .bead.Green { background: var(--green); }
.bead.new { animation: bead-pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes bead-pop { from { transform: scale(0); } to { transform: scale(1); } }
.beads-more { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-right: 2px; }
.beads-none { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pill.s-due { background: var(--red-soft); color: var(--red-ink); }
.pill.s-due::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.pill.s-scheduled { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.s-new { color: var(--muted); border: 1px dashed var(--line); }
.pill.s-mastered { background: var(--green-soft); color: var(--green-ink); }
.pill.s-mastered::before { content: "✓"; font-weight: 800; }
.rtag { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; }
.rtag::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--edge); }
.rtag.r-Red { color: var(--red-ink); } .rtag.r-Red::before { background: var(--red); }
.rtag.r-Yellow { color: var(--yellow-ink); } .rtag.r-Yellow::before { background: var(--yellow); }
.rtag.r-Green { color: var(--green-ink); } .rtag.r-Green::before { background: var(--green); }
.badge { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; vertical-align: 1px; }

/* signed out, account */
.fine { font-size: 13px; color: var(--ink-2); max-width: 52ch; margin: 0; }
.acct { flex: none; width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 1.5px solid var(--line); background: var(--surface-2); cursor: pointer; overflow: hidden; }
.acct img { width: 100%; height: 100%; display: block; }
.acct:hover, .acct[aria-expanded="true"] { border-color: var(--ink); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--code); }

/* popover menu (list switcher, snooze) */
.menu { position: fixed; z-index: 96; min-width: 220px; max-width: min(380px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--lift), 0 12px 32px -12px rgba(30,26,51,.3); padding: 6px; display: flex; flex-direction: column; }
.menu[hidden] { display: none; }
.menu .mh { font-size: 12.5px; color: var(--ink-2); font-weight: 700; padding: 6px 10px 4px; }
.menu button { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); }
.menu button:hover, .menu button:focus-visible { background: var(--code-soft); outline: none; }
.menu button small { display: block; font-weight: 500; color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
.menu button .ck { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 1px; display: grid; place-items: center; font-size: 11px; color: #fff; }
.menu button[aria-checked="true"] .ck { background: var(--code); border-color: var(--code); }
.menu button .cnt { margin-left: auto; font-size: 12.5px; color: var(--ink-2); font-weight: 600; white-space: nowrap; padding-left: 10px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .mf { font-size: 12.5px; color: var(--ink-2); padding: 4px 10px 6px; line-height: 1.4; }
.tag.bump { background: var(--yellow-soft); color: var(--yellow-ink); border-color: transparent; }
.qbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.qbtn:hover { border-color: var(--ink-2); color: var(--ink); }
.qbtn.on { background: var(--yellow-soft); color: var(--yellow-ink); border-color: transparent; }
.sched-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.datechips { display: flex; flex-wrap: wrap; gap: 6px; }

/* quick rate: the core action */
.quick { display: inline-flex; align-items: center; gap: 6px; }
.quick > span { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-right: 2px; }
.qr { border: 1.5px solid var(--edge); border-radius: 9px; padding: 5px 11px; font-weight: 700; font-size: 13.5px; cursor: pointer; box-shadow: var(--tactile); display: inline-flex; align-items: center; gap: 6px; background: var(--surface); transition: transform .08s, box-shadow .08s, background .12s; }
.qr::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--edge); }
.qr[data-r="Red"]::before { background: var(--red); } .qr[data-r="Yellow"]::before { background: var(--yellow); } .qr[data-r="Green"]::before { background: var(--green); }
.qr[data-r="Red"]:hover { background: var(--red-soft); } .qr[data-r="Yellow"]:hover { background: var(--yellow-soft); } .qr[data-r="Green"]:hover { background: var(--green-soft); }
.qr:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--shadow); }
.qr:active { transform: translateY(2px); box-shadow: none; }

/* ---------- today ---------- */
.today-head { display: grid; grid-template-columns: 1fr auto; gap: 16px 28px; align-items: end; }
.today-head .date { margin: 0 0 4px; color: var(--ink-2); font-weight: 600; }
.today-head h1 { font-size: clamp(30px, 4.2vw, 44px); line-height: 1.04; font-weight: 800; }
.today-head .lede { margin: 8px 0 0; color: var(--ink-2); font-size: 16px; max-width: 60ch; }
.kpis { display: grid; grid-template-columns: repeat(4, auto); gap: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--lift); overflow: hidden; }
.kpi { padding: 10px 16px; display: flex; flex-direction: column; border-left: 1px solid var(--line); min-width: 104px; }
.kpi:first-child { border-left: 0; }
.kpi b { font: 800 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.howto { display: grid; grid-template-columns: auto 1fr 1fr 1fr auto; gap: 14px 22px; align-items: center; padding: 14px 18px; background: var(--surface); }
.howto h2 { font-size: 15px; }
.step { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); }
.step b { color: var(--ink); display: block; font-size: 14px; }
.step i { font: 800 13px/24px var(--font-display); font-style: normal; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--code-soft); color: var(--code-ink); text-align: center; }
.step .dots { display: inline-flex; gap: 3px; vertical-align: -1px; }

.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 22px; }
.sec-head h2 .cnt { font: 700 14px var(--font-body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; margin-left: 6px; vertical-align: 3px; }
.sec-head .hint { color: var(--ink-2); font-size: 14px; }

.queue { display: flex; flex-direction: column; gap: 10px; }
.qcard { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px 16px; padding: 14px 18px 14px 0; align-items: center; overflow: hidden; }
.qcard .bar { align-self: stretch; background: var(--code); border-radius: 0 4px 4px 0; grid-row: span 2; }
.qcard.sd .bar { background: var(--sd); }
.q-name { font: 700 18px/1.25 var(--font-display); letter-spacing: -0.01em; }
.q-sub { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--ink-2); }
.q-late { font-weight: 700; font-size: 13px; color: var(--red-ink); white-space: nowrap; justify-self: end; }
.q-late.ok { color: var(--yellow-ink); }
.q-actions { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.q-actions .left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.empty { padding: 20px; color: var(--ink-2); }
.empty strong { color: var(--ink); }
.two { display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; align-items: start; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .when { font-weight: 600; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.row .quick .qr { padding: 3px 8px; font-size: 12.5px; }
.row.new { flex-wrap: wrap; }
.daylabel { font: 700 14.5px var(--font-display); white-space: nowrap; min-width: 84px; }
.daylabel small { display: block; font: 600 12.5px var(--font-body); color: var(--ink-2); }
.daylist { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
.day-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.day-item .linkish { font-weight: 600; }

/* ---------- coding list ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, input[type="text"], input[type="number"], input[type="date"], input[type="url"], input[type="search"], textarea {
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 7px 11px; font-weight: 500;
}
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--code); box-shadow: 0 0 0 3px var(--code-soft); }
.lsearch { flex: 1 1 240px; position: relative; }
.lsearch input { width: 100%; padding-left: 34px !important; }
.lsearch svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.chip b { font-weight: 700; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--inverse-bg); border-color: var(--inverse-bg); color: var(--inverse-fg); }
.chip[aria-pressed="true"] b { color: var(--chip-b); }
.chip.due b { color: var(--red-ink); }
.plist { overflow: hidden; }
.prow, .phead { display: grid; grid-template-columns: 34px minmax(0, 1fr) 66px 150px 60px 60px 128px 86px; gap: 12px; align-items: center; padding: 10px 18px; }
.phead { font-size: 12.5px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.prow { border-top: 1px solid var(--line); cursor: pointer; }
.prow:hover { background: var(--surface-2); }
.prow:hover .p-name { color: var(--code-ink); }
.pgroup { padding: 18px 18px 8px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); }
.phead + .pgroup { border-top: 0; }
.pgroup h3 { font-size: 16.5px; }
.pgroup .prog { flex: 0 1 140px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--heat-0); display: flex; }
.pgroup .prog span { background: var(--heat-2); }
.pgroup .prog span + span { background: var(--green); }
.pgroup small { color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.pgroup + .prow { border-top: 0; }
.p-num { font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.p-name { font-weight: 600; min-width: 0; }
.p-date { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.p-date.none { color: var(--muted); }
.p-status { justify-self: start; }
.p-m { display: none; }

/* ---------- design path ---------- */
.sd-intro { display: grid; grid-template-columns: 1fr auto; gap: 14px 24px; align-items: center; padding: 18px 20px; }
.sd-intro p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.unit-chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.units { display: flex; flex-direction: column; gap: 20px; }
.unit { padding: 16px 20px 4px; scroll-margin-top: 80px; }
.unit-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.unit-badge { font: 700 13px/1 var(--font-body); border-radius: 7px; padding: 5px 8px; background: var(--sd-soft); color: var(--sd-ink); }
.unit-head h3 { font-size: 19px; }
.unit-head p { margin: 0; color: var(--ink-2); font-size: 14px; flex-basis: 100%; }
.unit-head .uprog { margin-left: auto; font-weight: 700; color: var(--ink-2); font-size: 14px; }
.path { position: relative; margin-top: -6px; }
.path svg.trail { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.node { position: absolute; width: 128px; display: flex; flex-direction: column; align-items: center; gap: 7px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.disc { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--surface); box-shadow: 0 3px 0 var(--shadow); display: grid; place-items: center; font: 700 18px/1 var(--font-display); position: relative; transition: transform .1s ease, box-shadow .1s ease; }
.node:hover .disc { transform: translateY(-2px); box-shadow: 0 5px 0 var(--shadow); }
.node:active .disc { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.node .lbl { font-size: 13px; font-weight: 700; line-height: 1.2; text-align: center; max-width: 124px; }
.node .kind { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-top: -5px; }
.node.st-scheduled .disc { background: var(--rc, var(--yellow-soft)); }
.node.st-due .disc { background: var(--red); color: #fff; }
.node.st-mastered .disc { background: var(--green); }
.node.st-paused .disc { background: var(--surface-2); color: var(--muted); border-style: dashed; box-shadow: none; }
.node.next .disc { border-color: var(--sd); box-shadow: 0 3px 0 var(--sd-ink), 0 0 0 5px var(--sd-soft); }
.node .flag { position: absolute; top: -26px; font-size: 11.5px; font-weight: 800; color: #fff; background: var(--sd); border-radius: 6px; padding: 2px 7px; }
.node .flag::after { content: ""; position: absolute; left: 50%; bottom: -4px; margin-left: -4px; border: 4px solid transparent; border-bottom: 0; border-top-color: var(--sd); }
.node.st-due .flag { background: var(--red); } .node.st-due .flag::after { border-top-color: var(--red); }


/* ---------- roadmap ---------- */
.rm-head { display: grid; grid-template-columns: 1fr auto; gap: 14px 28px; align-items: end; }
.rm-head h2 { font-size: clamp(28px, 3.6vw, 38px); font-weight: 800; }
.rm-head .prose { margin-top: 6px; max-width: 70ch; }
.rm-form { display: grid; grid-template-columns: 170px 190px auto 130px auto 1fr; gap: 14px 18px; align-items: end; padding: 16px 18px; }
.rm-form .field select, .rm-form .field input { width: 100%; }
.rm-form .rm-actions { grid-column: 1 / -1; justify-content: flex-start; }
.rm-actions [data-act=rm-remove] { margin-left: auto; }
.rm-goal { grid-column: 1 / -1; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.rm-goal-row { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.rm-goal-row .fine { flex: 1 1 320px; max-width: 76ch; }
.rm-form .field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.rm-sd { padding-bottom: 8px; white-space: nowrap; }
.rm-actions { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.rm-state { font-size: 14px; color: var(--ink-2); }
.rm-note { grid-column: 1 / -1; margin: -2px 0 0; }
.rm-mapcard { position: relative; overflow: hidden; padding: 18px 14px 6px;
  background:
    radial-gradient(600px 260px at 12% 8%, rgba(98,70,234,.07), transparent 70%),
    radial-gradient(520px 260px at 88% 55%, rgba(28,140,224,.08), transparent 70%),
    radial-gradient(520px 240px at 30% 95%, rgba(34,176,125,.08), transparent 70%),
    var(--surface); }
.rm-mapcard.is-draft::before { content: "Preview"; position: absolute; top: 12px; right: 14px; font-size: 12px; font-weight: 700; color: var(--yellow-ink); background: var(--yellow-soft); border-radius: 6px; padding: 2px 8px; z-index: 3; }
.rm-map { position: relative; min-height: 200px; }
.rm-road { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.rm-road path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.rm-road .r-edge { stroke: var(--edge); stroke-width: 21.5; opacity: .85; }
.rm-road .r-base { stroke: var(--road); stroke-width: 18; }
.rm-road .r-done { stroke: var(--code); stroke-width: 18; }
.rm-road .r-dash { stroke: var(--road-dash); stroke-width: 2.5; stroke-dasharray: 9 11; opacity: .95; }
.rm-node { position: absolute; display: flex; flex-direction: column; align-items: center; }
.rm-node .st { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--edge); background: var(--surface); display: grid; place-items: center; font: 800 15px/1 var(--font-display); color: var(--ink); box-shadow: 0 3px 0 var(--shadow); cursor: pointer; position: relative; z-index: 2; padding: 0; transition: transform .1s; }
.rm-node .st:hover { transform: translateY(-2px); }
.st.st-done { background: var(--green); }
.st.st-current { background: var(--code); color: #fff; animation: rm-pulse 2.2s ease-out infinite; }
.st.st-behind { background: var(--yellow); }
.st.st-polish { background: var(--yellow-soft); color: var(--yellow-ink); font-size: 18px; }
.st.st-polish.st-current { background: var(--code); color: #fff; }
.st.st-start { background: var(--green-soft); color: var(--green-ink); cursor: default; }
.st.st-finish { background: #ffe9a8; color: #7a5200; cursor: default; width: 46px; height: 46px; }
@keyframes rm-pulse { 0% { box-shadow: 0 3px 0 var(--shadow), 0 0 0 0 rgba(98,70,234,.45); } 70% { box-shadow: 0 3px 0 var(--shadow), 0 0 0 14px rgba(98,70,234,0); } 100% { box-shadow: 0 3px 0 var(--shadow), 0 0 0 0 rgba(98,70,234,0); } }
.rm-here { position: absolute; top: -30px; z-index: 3; font-size: 11.5px; font-weight: 800; color: var(--inverse-fg); background: var(--inverse-bg); border-radius: 7px; padding: 3px 8px; white-space: nowrap; }
.rm-here::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -5px; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--inverse-bg); }
.rm-sign { position: absolute; top: -30px; left: -6px; z-index: 1; font-size: 11.5px; font-weight: 800; color: var(--ink-2); background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: 5px; padding: 2px 7px; transform: rotate(-4deg); white-space: nowrap; }
.rm-node:has(.rm-here) .rm-sign { left: auto; right: -6px; transform: rotate(4deg); }
.rm-card { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--lift); display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; }
.rm-card:hover { border-color: var(--ink-2); }
.rm-card[aria-pressed="true"] { background: color-mix(in srgb, var(--code) 7%, var(--surface)); }
.rm-card[aria-pressed="true"] { border-color: var(--code); box-shadow: 0 0 0 3px var(--code-soft), var(--lift); }
.rm-card.rm-current { border-color: var(--code); }
.rm-card.rm-behind { border-color: color-mix(in srgb, var(--yellow) 70%, var(--line)); }
.rm-card.rm-done { background: color-mix(in srgb, var(--green) 5%, var(--surface)); }
.rm-card.rm-endcap { cursor: default; align-items: center; text-align: center; box-shadow: none; background: transparent; border: 0; padding: 0; gap: 0; }
.rm-card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.rm-card-h b, .rm-endcap b { display: block; font: 700 15.5px/1.2 var(--font-display); }
.rm-dates { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.rm-line { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.rm-line b { color: var(--ink); }
.rm-line .tag { margin-right: 4px; vertical-align: 1px; }
.rm-dots { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 2px; }
.rm-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--edge); flex: none; display: inline-block; }
.rm-dot.d-R { background: var(--red); } .rm-dot.d-Y { background: var(--yellow); } .rm-dot.d-G { background: var(--green); }
.rm-dot.d-M { background: var(--mastered); box-shadow: 0 0 0 2px var(--green-soft); }
.rm-dot.d-N { background: var(--surface); border-color: var(--line-strong); }
.rm-mcount { margin-left: 4px; font-size: 12px; font-weight: 700; color: var(--green-ink); }
.st.st-mastered { background: var(--mastered); }
.st.st-started { background: var(--green-soft); color: var(--green-ink); }
.st.st-review { border-style: dashed; }
.st.st-review.st-current { border-style: solid; }
.rm-card.rm-review { background: var(--surface-2); box-shadow: none; }
.st.st-mastered svg path { stroke: var(--on-mastered); }
.rm-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 12px 6px 8px; border-top: 1px solid var(--line); margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.rm-lg { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.rm-behind { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--yellow-ink); }
.rm-ring { --p: 0%; flex: none; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(var(--green) var(--p), var(--heat-0) 0); display: grid; place-items: center; }
.rm-ring i { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font: 700 9.5px/1 var(--font-body); font-style: normal; color: var(--ink-2); }
.rm-node.is-col { flex-direction: row; align-items: flex-start; gap: 14px; padding-left: 6px; }
.rm-node.is-col .rm-card { margin-top: 0; }
.rm-node.is-col .rm-card.rm-endcap { align-items: flex-start; text-align: left; padding-top: 10px; }
.rm-node.is-col .rm-here { top: 6px; left: 54px; display: none; }
.rm-node.is-col .rm-sign { top: -24px; left: 50px; }
@media (max-width: 1080px) {
  .rm-form { grid-template-columns: 1fr 1fr 1fr; }
  .rm-form .rm-actions { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (max-width: 760px) {
  .rm-head { grid-template-columns: 1fr; }
  .rm-kpis { grid-template-columns: repeat(2, 1fr); }
  .rm-form { grid-template-columns: 1fr 1fr; }
  .rm-form .field:nth-child(3) { grid-column: 1 / -1; }
}

/* ---------- progress ---------- */
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.tile .k { color: var(--ink-2); font-size: 13.5px; font-weight: 600; }
.tile .v { font: 800 32px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .v small { font: 600 14px var(--font-body); color: var(--ink-2); margin-left: 4px; }
.tile.alert .v { color: var(--red-ink); }
.panel { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h3 { font-size: 18px; }
.panel .sub { color: var(--ink-2); font-size: 13.5px; margin-top: -10px; }
.mixbar { display: flex; gap: 3px; height: 16px; }
.mixbar span { border-radius: 5px; min-width: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--ink); margin-left: 4px; }
.heat-wrap { overflow-x: auto; padding-bottom: 4px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: 16px repeat(7, 14px); gap: 4px; width: max-content; }
.heat .cell { width: 14px; height: 14px; border-radius: 4px; }
.heat .cell.future { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.heat .cell.today { box-shadow: 0 0 0 1.5px var(--edge); }
.heat .mlab { font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; width: 14px; overflow: visible; }
.heat .dlab { font-size: 11px; color: var(--ink-2); width: 28px; line-height: 14px; }
.bars { display: flex; flex-direction: column; }
.brow { display: grid; grid-template-columns: 190px 1fr 60px 40px; gap: 14px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.brow.head { font-size: 12.5px; color: var(--ink-2); border-top: 0; padding-top: 0; font-weight: 700; }
.brow .n { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.brow .due-n { text-align: right; font-weight: 700; color: var(--red-ink); }
.brow .due-n.zero { color: var(--muted); font-weight: 500; }
.tbar { display: flex; gap: 2px; height: 10px; }
.tbar span { border-radius: 3px; }
.tbar .m { background: var(--green); } .tbar .s { background: var(--heat-2); } .tbar .n { background: var(--heat-0); }

/* ---------- settings ---------- */
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.iv { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; }
.iv input { width: 72px; text-align: right; }
.iv label { display: flex; flex-direction: column; gap: 1px; }
.iv small { color: var(--ink-2); font-size: 12.5px; }
.iv .unit-lbl { color: var(--ink-2); font-size: 13px; }
.iv h4 { grid-column: 1 / -1; margin: 6px 0 0; }
.prose { color: var(--ink-2); font-size: 14px; max-width: 64ch; margin: 0; }
.row-gap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.set-grid > * { min-width: 0; }
.fmt { border-top: 1px solid var(--line); padding-top: 10px; }
.fmt summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink); list-style-position: inside; }
.fmt summary:hover { color: var(--code-ink); }
.fmt[open] summary { margin-bottom: 10px; }
.fmt-cols { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13.5px; color: var(--ink-2); }
.fmt-cols dt { font-weight: 700; color: var(--ink); }
.fmt-cols dd { margin: 0; }
.fmt-cols code, .fmt p code { font: 600 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); border-radius: 5px; padding: 1px 5px; color: var(--ink); white-space: nowrap; }
.fmt pre { margin: 0 0 10px; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
@media (max-width: 560px) { .fmt-cols { grid-template-columns: 1fr; gap: 2px; } .fmt-cols dd { margin-bottom: 8px; } }

/* ---------- drawer ---------- */
/* week progress on Today */
.wkbar { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px 16px; text-decoration: none; color: inherit; }
.wkbar:hover { border-color: var(--ink-2); }
.wkbar-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.wkbar-top b { font: 700 16px var(--font-display); color: var(--ink); }
.wkbar-top span { font-size: 14px; color: var(--ink-2); }
.wkbar-track { height: 14px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid var(--edge); overflow: hidden; }
.wkbar-track i { display: block; height: 100%; background: var(--code); border-right: 1.5px solid var(--edge); transition: width .6s cubic-bezier(.3,1.2,.5,1); }
.wkbar-track i[style*="width:0%"], .wkbar-track i[style="width: 0%;"] { border-right: 0; }
.wkbar.is-done .wkbar-track i { background: var(--green); border-right: 0; }
.wkbar.is-done .wkbar-top b { color: var(--green-ink); }
@media (prefers-reduced-motion: reduce) { .wkbar-track i { transition: none; } }
/* week done on Today */
.wkdone { display: flex; gap: 16px; align-items: flex-start; padding: 20px; border: 1.5px solid var(--edge); box-shadow: 0 4px 0 var(--shadow); background: linear-gradient(135deg, var(--green-soft), var(--surface) 60%); }
.wkdone-badge { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--green); border: 2px solid var(--edge); box-shadow: 0 3px 0 var(--shadow); display: grid; place-items: center; animation: wkdone-pop .5s cubic-bezier(.3,1.6,.5,1); }

const RM_LEVELS = [["M", "Mastered"], ["G", "Green"], ["Y", "Yellow"], ["R", "Red"], ["N", "Not started"]];

function layoutRoadmap(Vin) {
  const map = $("#rm-map"); if (!map) return;
  const nodes = $$(".rm-node", map); if (!nodes.length) return;
  const W = map.clientWidth; if (!W) return;
  const cols = W >= 1060 ? 4 : W >= 800 ? 3 : W >= 560 ? 2 : 1;
  const pts = [];
  if (cols === 1) {
    let y = 34;
    nodes.forEach(n => {
      const card = $(".rm-card", n);
      n.className = "rm-node is-col";
      card.style.width = (W - 74) + "px";
      n.style.left = "0px"; n.style.top = (y - 20) + "px";
      pts.push({ x: 26, y, row: 0 });
      y += Math.max(64, card.offsetHeight + 26);
    });
    map.style.height = (y - 10) + "px";
  } else {
    const pad = 34, cellW = (W - 2 * pad) / cols, cardW = Math.min(250, cellW - 22);
    const rows = Math.ceil(nodes.length / cols);
    let top = 44;
    for (let r = 0; r < rows; r++) {
      const rowNodes = nodes.slice(r * cols, r * cols + cols);
      let maxH = 0;
      rowNodes.forEach((n, k) => {
        const i = r * cols + k, col = r % 2 ? cols - 1 - k : k;
        const card = $(".rm-card", n);
        n.className = "rm-node";
        card.style.width = cardW + "px";
        const x = pad + col * cellW + cellW / 2, y = top + (col % 2 ? 14 : 0);
        n.style.left = (x - cardW / 2) + "px"; n.style.top = (y - 20) + "px"; n.style.width = cardW + "px";
        pts[i] = { x, y, row: r };
        maxH = Math.max(maxH, card.offsetHeight);
      });
      top += 14 + 30 + maxH + 70;
    }
    map.style.height = (top - 40) + "px";
  }
  // road through the stations; U-turns swing outside the cards
  const pathTo = n => {
    let d = "";
    pts.slice(0, n).forEach((p, i) => {
      if (!i) { d = `M${p.x} ${p.y}`; return; }
      const a = pts[i - 1];
      if (cols === 1 || a.row === p.row) {
        if (cols === 1) { d += ` L${p.x} ${p.y}`; return; }
        const mx = (a.x + p.x) / 2; d += ` C${mx} ${a.y} ${mx} ${p.y} ${p.x} ${p.y}`;
      } else {
        const dir = a.x > W / 2 ? 1 : -1, room = dir > 0 ? W - a.x : a.x, k = Math.max(40, room - 16) / 0.75;
        d += ` C${a.x + dir * k} ${a.y} ${p.x + dir * k} ${p.y} ${p.x} ${p.y}`;
      }
    });
    return d;
  };
  const svg = $(".rm-road", map);
  svg.setAttribute("width", W); svg.setAttribute("height", map.style.height.replace("px", ""));
  const all = pathTo(pts.length);
  $(".r-edge", svg).setAttribute("d", all);
  $(".r-base", svg).setAttribute("d", all);
  $(".r-dash", svg).setAttribute("d", all);
  if (cols > 1) nodes.forEach((n, i) => {
    const sg = $(".rm-sign", n), a = pts[i - 1], b = pts[i];
    if (!sg || !a || a.row !== b.row) return;
    const left = parseFloat(n.style.left);
    sg.style.left = ((a.x + b.x) / 2 - left - sg.offsetWidth / 2) + "px"; sg.style.right = "auto";
    sg.style.top = (Math.min(a.y, b.y) - 40 - parseFloat(n.style.top)) + "px";
  });
  const V = Vin || null;
  const reached = V ? Math.max(0, Math.min(pts.length, V.cur + 2)) : 0;
  $(".r-done", svg).setAttribute("d", reached > 1 ? pathTo(reached) : "");
}

/* ----- progress ----- */
function renderProgress(list) {

  const due = list.filter(p => p.status === "due").length, mastered = list.filter(p => p.status === "mastered").length;
  const total = list.reduce((s, p) => s + p.n, 0);
  const counts = new Map(); const recent = [];
  for (const p of list) for (const a of p.atts) { counts.set(a.d, (counts.get(a.d) || 0) + 1); recent.push({ p, a }); }
  recent.sort((x, y) => x.a.d < y.a.d ? 1 : x.a.d > y.a.d ? -1 : y.a._i - x.a._i);
  const st = streak(list);
  const mix = { Red: 0, Yellow: 0, Green: 0 };
  for (const p of list) if (p.last) mix[p.last.r]++;
  const mixTotal = mix.Red + mix.Yellow + mix.Green;
  const WEEKS = 20, todayIdx = (parts(S.today).wd + 6) % 7, start = addDays(S.today, -todayIdx - (WEEKS - 1) * 7);
  const level = n => n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : n <= 6 ? 3 : 4;
  let heat = `<span></span>` + ["Mon","","Wed","","Fri","",""].map(l => `<span class="dlab">${l}</span>`).join(""), lastMonth = -1;
  for (let w = 0; w < WEEKS; w++) {

    heat += `<span class="mlab">${pm !== lastMonth ? MON[pm - 1] : ""}</span>`; lastMonth = pm;
    for (let d = 0; d < 7; d++) {
      const iso = addDays(first, d), n = counts.get(iso) || 0, fut = iso > S.today;
      heat += `<span class="cell ${fut ? "future" : ""} ${iso === S.today ? "today" : ""}" style="${fut ? "" : "background:var(--heat-" + level(n) + ")"}" ${fut ? "" : `data-tip="${esc(fmtDay(iso) + ": " + plural(n, "attempt"))}"`}></span>`;
    }

  const barRows = groups => groups.map(x => `
    <div class="brow"><span>${esc(x.t)}</span>

  const legend = `<div class="legend"><span><i style="background:var(--green)"></i>Mastered</span><span><i style="background:var(--heat-2)"></i>In progress</span><span><i style="background:var(--heat-0)"></i>Not started</span></div>`;

    <div class="sec-head"><h2>Progress</h2><span class="hint">${plural(total, "attempt")} logged so far</span></div>
    <div class="tiles">

    </div>

  <div class="two">
    <section class="card panel">
      <h3>Activity</h3><p class="sub">Attempts per day, last ${WEEKS} weeks</p>

  </div>`;

const WS = { open: false, key: null, api: null, root: null, ver: -1, savedVer: -1, timer: null, saving: false, tooBig: false };
let excPromise = null;
const EXC_BASE = "https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/";
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); }); }
function loadExcalidraw() {
  if (window.ExcalidrawLib) return Promise.resolve(window.ExcalidrawLib);

    window.EXCALIDRAW_ASSET_PATH = EXC_BASE;

    if (!window.ReactDOM) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js");
    await loadScript(EXC_BASE + "excalidraw.production.min.js");
    return window.ExcalidrawLib;
  })().catch(e => { excPromise = null; throw e; });
  return excPromise;
}
async function openWorksheet() {
  const p = byKey(allItems(), S.open); if (!p) return;

  Object.assign(WS, { open: true, key: p.key, ver: -1, savedVer: -1, tooBig: false });

  if (!WS.open || WS.key !== p.key) return;
  $("#ws-loading").hidden = true;
  const saved = S.docs.get("w_" + p.key);

  const R = window.React;
  WS.ver = WS.savedVer = lib.getSceneVersion(elements);
  WS.root = window.ReactDOM.createRoot($("#ws-root"));
  WS.root.render(R.createElement(lib.Excalidraw, {
    theme: isDark() ? "dark" : "light",
    initialData: { elements, appState: { viewBackgroundColor: "#ffffff", currentItemStrokeColor: "#1e1e1e", currentItemRoughness: 1, currentItemFontFamily: 2 }, scrollToContent: true },
    excalidrawAPI: api => { WS.api = api; },
    onChange: els => {

    },

}

  const keep = els.filter(e => !e.isDeleted && e.type !== "image");

}
async function saveWorksheet() {
  clearTimeout(WS.timer);
  if (!WS.api || WS.ver === WS.savedVer) return;
  const ver = WS.ver, key = WS.key;
  const elements = cleanElements(WS.api.getSceneElementsIncludingDeleted());
  const body = { elements, at: new Date().toISOString() };
  if (JSON.stringify(body).length > 240000) { WS.tooBig = true; wsStatus(); return; }
  WS.tooBig = false; WS.saving = true; wsStatus();

}

function importJSON(text) {
  if (!guardLoaded()) return;
  let data; try { data = JSON.parse(text); } catch (e) { toast("That file isn't valid JSON."); return; }
  if (!data || data.app !== "blind75-tracker" || !data.docs || typeof data.docs !== "object") { toast("That isn't a backup from this tracker."); return; }
  const entries = Object.entries(data.docs).filter(([k, v]) => (k === "settings" || /^[psw]_[A-Za-z0-9_.~:@+-]{1,180}$/.test(k)) && v && typeof v === "object");
  const nAtt = entries.reduce((s, [, v]) => s + (Array.isArray(v.attempts) ? v.attempts.filter(validAtt).length : 0), 0);
  confirmModal("Restore this backup?", `It has ${plural(nAtt, "attempt")}${data.exportedAt ? ", exported " + esc(fmtFull(localISO(new Date(data.exportedAt)))) : ""}. Everything currently in the tracker is replaced.`, "Replace my data", async () => {

    for (const [k, v] of entries) { await writeDoc(k, v); if (++i % 10 === 0) await sleep(300); }
    for (const k of [...S.docs.keys()]) if (!keep.has(k)) await writeDoc(k, null);

function parseCSV(text) {

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }

}
function looseDate(s) {
  s = String(s || "").trim(); if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m) return (m[3].length === 2 ? "20" + m[3] : m[3]) + "-" + pad(+m[1]) + "-" + pad(+m[2]);

}
function importCSV(text) {
  if (!guardLoaded()) return;
  const marker = text.indexOf("## Sheet name: Tracker");
  if (marker >= 0) { text = text.slice(text.indexOf("\n", marker) + 1); const nx = text.indexOf("## Sheet name:"); if (nx >= 0) text = text.slice(0, nx); }
  const rows = parseCSV(text), low = r => r.map(c => String(c).trim().toLowerCase());
  let h = rows.findIndex(r => { const l = low(r); return l.includes("problem") && l.includes("topic"); });
  if (h < 0) h = rows.findIndex(r => low(r).includes("problem"));
  if (h < 0) { toast("Couldn't find a header row with a Problem column."); return; }
  const H = low(rows[h]);
  const col = { name: H.indexOf("problem"), topic: H.indexOf("topic"), diff: H.findIndex(x => x.startsWith("difficulty")), notes: H.findIndex(x => x.startsWith("notes")) };
  const dates = {}, rates = {};
  H.forEach((x, i) => { let m = x.match(/^att(?:empt)?\s*#?\s*(\d+)\s*date$/); if (m) dates[m[1]] = i; m = x.match(/^att(?:empt)?\s*#?\s*(\d+)\s*rating$/); if (m) rates[m[1]] = i; });
  const st0 = settings(), list = allItems().filter(p => p.track === "code");
  const union = Object.values(ANY).map(c => derive(Object.assign({}, c, { doc: S.docs.get(c.key) || null }), st0)).concat(list.filter(p => p.custom));
  const byName = new Map(union.map(p => [norm(p.name), p]));
  const plan = []; let addCount = 0, newProblems = 0, notesCount = 0;
  for (const r of rows.slice(h + 1)) {
    const name = String(r[col.name] || "").trim(); if (!name) continue;
    const atts = [];
    for (const k of Object.keys(dates)) {
      const d = looseDate(r[dates[k]]), rt = String(r[rates[k]] || "").trim(), R = RATINGS.find(x => x.toLowerCase() === rt.toLowerCase());
      if (d && R && d <= S.today) atts.push({ d, r: R });
    }
    let notes = col.notes >= 0 ? String(r[col.notes] || "").trim() : ""; if (/^LC Premium/i.test(notes)) notes = "";
    const p = byName.get(norm(name)), existing = p ? p.atts : [];
    const fresh = atts.filter(a => !existing.some(e => e.d === a.d && e.r === a.r));
    const addNotes = notes && !(p && p.notes.includes(notes));
    if (p && !fresh.length && !addNotes) continue;
    if (!p && !atts.length && !notes) continue;
    plan.push({ p, name, topic: String(r[col.topic] || "").trim() || "Other", diff: String(r[col.diff] || "").trim(), atts: fresh, notes: addNotes ? notes : "" });
    addCount += fresh.length; if (!p) newProblems++; if (addNotes) notesCount++;
  }
  if (!plan.length) { toast("Everything in that file is already in the tracker."); return; }
  const bits = addCount ? [plural(addCount, "new attempt")] : [];
  if (notesCount) bits.push("notes for " + plural(notesCount, "problem"));
  if (newProblems) bits.push(plural(newProblems, "problem") + " not in the Blind 75 list, added as extra problems");
  confirmModal("Import from your sheet?", "Found " + bits.join(", ") + ". Nothing already here is removed.", "Import", async () => {
    let i = 0;
    for (const it of plan) {
      let key, base;
      if (it.p) { key = it.p.key; base = itemDoc(key); }
      else {
        let pid = "c-" + (slugify(it.name) || "problem"), k = 2;
        while (S.docs.has("p_" + pid)) pid = "c-" + slugify(it.name) + "-" + k++;
        key = "p_" + pid;
        base = { pid, attempts: [], notes: "", custom: { name: it.name, topic: it.topic, difficulty: DIFF[(it.diff || "M")[0].toUpperCase()] || "Medium", url: "https://leetcode.com/problems/" + slugify(it.name) + "/" }, order: nextOrder(list, it.topic) };
      }
      ensureIds(base);
      for (const a of it.atts) base.attempts.push({ id: uid(), d: a.d, r: a.r });
      if (it.notes) base.notes = base.notes ? base.notes + "\n\n" + it.notes : it.notes;
      await writeDoc(key, base);
      if (++i % 10 === 0) await sleep(300);
    }
    toast("Imported " + plural(addCount, "attempt") + ".");

}


/* ================= modal, toast, tooltip, confetti ================= */
let modalPrevFocus = null;
function openModal(html) { modalPrevFocus = document.activeElement; $("#modal").innerHTML = html; $("#modal-wrap").classList.add("on"); }
function closeModal() { $("#modal-wrap").classList.remove("on"); $("#modal").innerHTML = ""; if (modalPrevFocus && document.contains(modalPrevFocus)) modalPrevFocus.focus({ preventScroll: true }); }
function confirmModal(title, body, okLabel, onOk) {

  $("#m-ok").focus();

}
let toastTimer = null;
function toast(msg, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button class="toast-btn" id="toast-act">${esc(action.label)}</button>` : "");
  t.classList.toggle("has-act", !!action); t.classList.add("on");
  if (action) $("#toast-act").addEventListener("click", () => { t.classList.remove("on"); action.fn(); });
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), action ? 6500 : 3200);
}
const tip = $("#tip");
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest("[data-tip]"); if (!el) { tip.classList.remove("on"); return; }
  tip.textContent = el.dataset.tip; tip.classList.add("on");
  const r = el.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
});
document.addEventListener("scroll", e => {
  tip.classList.remove("on");
  if ($("#menu").hidden || (e.target && e.target.closest && e.target.closest("#menu"))) return;
  // ignore the incidental scroll that can fire as a menu opens; close on a real scroll
  if (performance.now() - MENU.openedAt < 400 || Math.abs(window.scrollY - MENU.scrollY) < 24 && (e.target === document || e.target === document.documentElement)) return;
  closeMenu();
}, true);
window.addEventListener("resize", () => closeMenu());
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(x, y, count) {
  if (reduceMotion) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#6246ea", "#1c8ce0", "#f5b623", "#22b07d", "#f05454"];
  const ps = Array.from({ length: count }, () => ({ x, y, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 3, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .4; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (t - t0 < 1800) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);

}

const gs = $("#gs");

gs.addEventListener("focus", gsRender);
